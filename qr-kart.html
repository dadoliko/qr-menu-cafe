<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mavi Fincan Kafe için A6 boyutunda yazdırılabilir QR menü kartı.">
  <title>Mavi Fincan Kafe — A6 QR Menü Kartı</title>
  <link rel="stylesheet" href="qr-kart.css">
</head>
<body>
  <main class="menu-card" aria-labelledby="brand-name">
    <header class="brand">
      <h1 id="brand-name">mavi fincan<span aria-hidden="true">.</span></h1>
      <p class="brand-subtitle">KAFE & KÜÇÜK MUTLULUKLAR</p>
    </header>

    <p class="slogan">Bir fincanlık mola.</p>

    <a class="qr-frame" href="https://dadoliko.github.io/qr-menu-cafe/" aria-label="Mavi Fincan Kafe dijital menüsünü aç">
      <img src="assets/qr/mavi-fincan-qr-temiz.png" width="450" height="450" alt="Mavi Fincan Kafe dijital menüsünün QR kodu">
    </a>

    <p class="scan-instruction">Menüyü görmek için<br>kameranızla okutun.</p>

    <div class="coffee-detail" aria-hidden="true">
      <span class="detail-line"></span>
      <span class="coffee-icon"></span>
      <span class="detail-line"></span>
    </div>
  </main>
</body>
</html>
